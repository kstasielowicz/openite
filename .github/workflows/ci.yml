name: CI
on:
  push: {branches: [main]}
  pull_request:

permissions:
  contents: read   # least privilege: CI can't write to the repo or publish anything

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: python tests/test_e2e.py
      - run: python tests/test_go_agent.py
