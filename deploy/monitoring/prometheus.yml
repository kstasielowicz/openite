global:
  scrape_interval: 30s
scrape_configs:
  - job_name: openite
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/openite-token
    static_configs:
      # Change to wherever your Openite server listens, e.g. 192.168.1.10:8080
      - targets: ["host.docker.internal:8080"]
